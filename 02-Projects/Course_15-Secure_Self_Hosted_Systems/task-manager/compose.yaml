name: task-ledger

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-ledger:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://taskapp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/taskapp
      ACCESS_ISSUER: ${ACCESS_ISSUER:?Set ACCESS_ISSUER in .env}
      ACCESS_AUD: ${ACCESS_AUD:?Set ACCESS_AUD in .env}
      ALLOW_DEV_AUTH: "false"
      PGPOOL_MAX: "10"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - data_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d taskapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["edge"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  app_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
